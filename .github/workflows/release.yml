name: Release

# Pushing a tag such as v1.2.0 runs the tests, builds a universal SleepGuard.app, packs it into
# an installer package and publishes that as a GitHub release. Running the workflow by hand does
# the same build without publishing: the package is attached to the run as an artifact instead.
#
# Ordinary pushes are checked by ci.yml.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: scripts/test.sh

      - name: Build and package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0; fi
          VERSION=$version UNIVERSAL=1 scripts/build.sh
          scripts/package.sh
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Keep the dry-run build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: SleepGuard-dry-run
          path: build/SleepGuard-*.pkg*
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/notes.md <<'EOF'
          Open the package and follow the installer. It puts SleepGuard into Applications and sets up the helper that lets it change the sleep setting without asking for a password each time.

          The package is not notarized, so macOS refuses to open a downloaded copy on the first try: go to System Settings → Privacy & Security and click **Open Anyway**. Or install it from a terminal:

          ```sh
          sudo installer -pkg SleepGuard-*.pkg -target /
          ```

          To remove SleepGuard, drag it from Applications to the Trash. The helper removes itself within about ten minutes.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "build/SleepGuard-$VERSION.pkg" "build/SleepGuard-$VERSION.pkg.sha256" \
            --title "SleepGuard $VERSION" --verify-tag --generate-notes --notes-file build/notes.md
